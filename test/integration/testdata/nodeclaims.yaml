    group: cpu-group
    infra.homecluster.dev/node: cpu-node-1
    test-scenario: cpu-workload
spec:
  slotRef:
    name: cpu-node-1
  requestedAt: "2024-01-15T08:00:00Z"
  requestedBy: cluster-autoscaler
  request:
    call: IncreaseSize
    delta: 1
    group: cpu-group
  deadlineAt: "2024-01-15T08:10:00Z"
status:
  phase: ready
  attempt: 1

---
# The scale-down the provider has been asked for: the request is recorded on the claim that owns
# the machine, and the claim is what carries it until the machine is observed off.
apiVersion: infra.homecluster.dev/v2alpha1
kind: NodeClaim
metadata:
  name: claim-cpu-node-2
  namespace: "{{ .Namespace }}"
  labels:
    app.kubernetes.io/name: homelab-autoscaler
    group: cpu-group
    infra.homecluster.dev/node: cpu-node-2
    test-scenario: shutting-down
spec:
  slotRef:
    name: cpu-node-2
  requestedAt: "2024-01-15T08:00:00Z"
  requestedBy: cluster-autoscaler
  request:
    call: DeleteNodes
    group: cpu-group
    nodes:
    - cpu-node-2
  deadlineAt: "2024-01-15T08:10:00Z"
status:
  phase: ready
  attempt: 1

---
# The boot in flight of the pool that is starting up: the claim is booting, the machine has not
# joined, and the slot reports booting.
apiVersion: infra.homecluster.dev/v2alpha1
kind: NodeClaim
metadata:
  name: claim-startup-node-1
  namespace: "{{ .Namespace }}"
  labels:
    app.kubernetes.io/name: homelab-autoscaler
    group: unknown-group
    infra.homecluster.dev/node: startup-node-1
    test-scenario: starting-up
spec:
  slotRef:
    name: startup-node-1
  requestedAt: "2024-01-15T10:00:00Z"
  requestedBy: cluster-autoscaler
  request:
    call: IncreaseSize
    delta: 1
    group: unknown-group
  deadlineAt: "2024-01-15T10:10:00Z"
status:
  phase: booting
  attempt: 1

