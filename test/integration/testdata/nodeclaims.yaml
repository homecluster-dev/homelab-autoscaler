# NodeClaim test data: the scale-up requests of the slots in nodes.yaml.
#
# In v2alpha1 a slot is capacity exactly while a live claim (pending, booting, ready) names it,
# so this file is the fixture that says which of the slots in nodes.yaml are wanted, by which
# request, and how that request ended. A slot with no claim here is a free slot: IncreaseSize may
# claim it, TargetSize does not count it.

---
apiVersion: infra.homecluster.dev/v2alpha1
kind: NodeClaim
metadata:
  name: claim-test-node-1
  namespace: "{{ .Namespace }}"
  labels:
    app.kubernetes.io/name: homelab-autoscaler
    group: test-group
    infra.homecluster.dev/node: test-node-1
    test-scenario: basic
spec:
  slotRef:
    apiVersion: infra.homecluster.dev/v2alpha1
    kind: Node
    name: test-node-1
  requestedAt: "2024-01-15T09:25:00Z"
  requestedBy: cluster-autoscaler
  request:
    call: IncreaseSize
    delta: 1
    group: test-group
  deadlineAt: "2024-01-15T09:35:00Z"
  ttlSecondsAfterFinished: 3600
status:
  phase: ready
  attempt: 1

---
apiVersion: infra.homecluster.dev/v2alpha1
kind: NodeClaim
metadata:
  name: claim-test-node-2
  namespace: "{{ .Namespace }}"
  labels:
    app.kubernetes.io/name: homelab-autoscaler
    group: test-group
    infra.homecluster.dev/node: test-node-2
    test-scenario: basic
spec:
  slotRef:
    name: test-node-2
  requestedAt: "2024-01-15T09:26:00Z"
  requestedBy: cluster-autoscaler
  request:
    call: IncreaseSize
    delta: 1
    group: test-group
  deadlineAt: "2024-01-15T09:36:00Z"
status:
  phase: ready
  attempt: 1

---
# gpu-node-1 is running and claimed; gpu-node-2 is the scale-up candidate of the group and has
# no claim, which is the only shape NodeGroupIncreaseSize may claim.
apiVersion: infra.homecluster.dev/v2alpha1
kind: NodeClaim
metadata:
  name: claim-gpu-node-1
  namespace: "{{ .Namespace }}"
  labels:
    app.kubernetes.io/name: homelab-autoscaler
    group: gpu-group
    infra.homecluster.dev/node: gpu-node-1
    test-scenario: gpu-workload
spec:
  slotRef:
    name: gpu-node-1
  requestedAt: "2024-01-15T08:00:00Z"
  requestedBy: cluster-autoscaler
  request:
    call: IncreaseSize
    delta: 1
    group: gpu-group
  deadlineAt: "2024-01-15T08:10:00Z"
status:
  phase: ready
  attempt: 1

---
apiVersion: infra.homecluster.dev/v2alpha1
