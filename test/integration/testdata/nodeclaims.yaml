---
# An attempt that ended: the machine it asked for never became usable, so the slot is free again
# and the request is not counted by TargetSize. `kubectl get nodeclaim` shows the episode until
# its TTL collects it, and Node.status.lastClaim keeps the story after that.
apiVersion: infra.homecluster.dev/v2alpha1
kind: NodeClaim
metadata:
  name: claim-gpu-node-2
  namespace: "{{ .Namespace }}"
  labels:
    app.kubernetes.io/name: homelab-autoscaler
    group: gpu-group
    infra.homecluster.dev/node: gpu-node-2
    test-scenario: scale-up-candidate
spec:
  slotRef:
    name: gpu-node-2
  requestedAt: "2024-01-15T07:00:00Z"
  requestedBy: cluster-autoscaler
  request:
    call: IncreaseSize
    delta: 1
    group: gpu-group
  deadlineAt: "2024-01-15T07:10:00Z"
status:
  phase: failed
  attempt: 2
  reason: DeadlineExceeded
  finishedAt: "2024-01-15T07:10:00Z"
