{{- /*
WARNING: the rules of this ClusterRole are derived from config/rbac/role.yaml, which is
generated by controller-gen, and are currently a superset of it: this chart additionally
grants cluster-scoped CRUD on configmaps and secrets, which the generated role does not
(no RBAC marker emits it - it backs the Secret/ConfigMap volumes the startup and shutdown
Jobs mount). Run `make manifests` and merge the rules over by hand, they are not rendered
from the markers, and keep the configmaps/secrets rule: a plain copy silently drops it.
Rules the markers DO generate must be mirrored here identically and in the generated order -
the events create/patch rule (scale up/down Events recorded on the Node CR) is one such rule.
The templated metadata.name must stay name-consistent with the roleRef in ./role_binding.yaml.
*/ -}}
{{- if and .Values.rbac.enable .Values.controllerManager.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: {{ include "chart.name" . }}-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - nodes/finalizers
  verbs:
  - update
- apiGroups:
  - ""
  resources:
  - nodes/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infra.homecluster.dev
  resources:
  - groups
  - nodes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infra.homecluster.dev
  resources:
  - groups/finalizers
  - nodes/finalizers
  verbs:
  - update
- apiGroups:
  - infra.homecluster.dev
  resources:
  - groups/status
  - nodes/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - get
  - list
  - watch
{{- end -}}
