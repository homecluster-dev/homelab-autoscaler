name: K3d Cluster Test

on:
  pull_request:
    branches:
      - main
      - 'feat/**'
  workflow_run:
    workflows: ["Test Chart", "Release Chart", "Build and Push Docker Image"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
      
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      
      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Run E2E tests
        run: make test-e2e

      # The controller under test runs on the runner, outside the cluster, started by `make test-e2e`
      # with nohup into /tmp/homelab-autoscaler.log. Nothing in the job shows it, and every gate in
      # the suite asserts a decision that controller made, so a red run is only debuggable with its
      # lines: what the slot reconciler read, what it wrote to the node object, what it refused.
      - name: Show the local controller log
        if: failure()
        run: |
          echo "::group::/tmp/homelab-autoscaler.log (last 3000 lines)"
          tail -n 3000 /tmp/homelab-autoscaler.log || echo "no controller log at /tmp/homelab-autoscaler.log"
          echo "::endgroup::"
