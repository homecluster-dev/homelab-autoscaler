apiVersion: infra.homecluster.dev/v1alpha1
kind: Group
metadata:
  name: group1
  namespace: homelab-autoscaler-system
spec:
  ignoreDaemonSetsUtilization: true
  maxNodeProvisionTime: 2m
  scaleDownGpuUtilizationThreshold: "30"
  scaleDownUnneededTime: 30s
  scaleDownUnreadyTime: 30s
  scaleDownUtilizationThreshold: "70"
  zeroOrMaxNodeScaling: false
  # Keep one node of the group up: cluster-autoscaler never scales the group below
  # this floor. Omit it (0) to let the group scale to nothing.
  minSize: 1
